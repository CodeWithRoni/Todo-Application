name: Release Taskflow Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-*.yml'
      - 'electron/**'
      - 'electron-builder.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'vite.config.js'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install --no-save --package-lock=false @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8
      - run: npm run build
      - name: Generate native Android app
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Taskflow-Android-debug.apk
      - name: Build signed APK if secrets are configured
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/taskflow-release.jks
          cat >> android/app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              taskflowRelease {
                storeFile file('taskflow-release.jks')
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
              }
            }
            buildTypes {
              release { signingConfig signingConfigs.taskflowRelease }
            }
          }
          GRADLE
          (cd android && ./gradlew assembleRelease --no-daemon)
          cp android/app/build/outputs/apk/release/app-release.apk release-output/Taskflow-Android-signed-release.apk
          rm -f android/app/taskflow-release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-android
          path: release-output/*.apk
          if-no-files-found: error
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          target_commitish: main
          name: Taskflow v1.1.0 — Ocean Edition
          files: release-output/*.apk
