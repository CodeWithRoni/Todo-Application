name: Release Taskflow Windows macOS Linux
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install desktop packaging tools
        run: npm install --no-save --package-lock=false electron@^39 electron-builder@^26
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Package desktop
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release-output/*.exe
            release-output/*.dmg
            release-output/*.deb
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-output/*.exe
            release-output/*.dmg
            release-output/*.deb
          fail_on_unmatched_files: false
